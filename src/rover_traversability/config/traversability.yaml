# All values are doubles: write 50.0, not 50 (ROS rejects an int for a double parameter).
# Defaults for the map/cost fields live in rover_traversability/height_map.py (HeightMapConfig);
# they are repeated here so this file is the one place to look and tune.
traversability_node:
  ros__parameters:
    use_sim_time: true

    # --- I/O (strings) ---
    input_cloud_topic: /points
    oracle_topic: /satellite/oracle_fix
    map_frame: map
    rover_frame: base_footprint

    # --- grid geometry. nav2 global_costmap is static-layer-fed, so it adopts this grid. ---
    resolution: 0.10
    map_size_x: 50.0
    map_size_y: 50.0
    origin_x: -25.0
    origin_y: -25.0

    # --- scan filtering / rate ---
    min_range: 0.35
    max_range: 15.0
    update_period: 0.50
    publish_debug_costmaps: true    # also publish /traversability/{slope,step}_costmap

    # --- Bayesian height map ---
    sigma_sensor: 0.02        # lidar depth noise std dev (m)
    sigma_angular: 0.01       # lever-arm uncertainty per metre of range (rad)
    k_drift: 0.005            # variance growth (m^2/s) since the last global fix
    min_variance: 0.0001      # variance floor (m^2)
    mahalanobis_gate: 3.5     # outlier rejection (std devs)
    k_age: 0.002              # stored-variance growth (m^2/s); untuned first guess
    max_variance: 0.05        # cap on aging (m^2)
    spawn_bootstrap_radius: 1.5   # known-ground disc under the rover at start (m)
    lidar_height: 0.23            # lidar height above ground at spawn (m)

    # --- slope costmap ---
    slope_free_deg: 30.0      # <= this: cost 0
    slope_warn_deg: 35.0      # up to this: flat cost slope_warn_cost
    slope_lethal_deg: 45.0    # warn..lethal ramps to 100; above this: lethal
    slope_warn_cost: 10.0
    rover_footprint_radius: 0.45  # cells this close to the rover are forced free
