# ==============================================================================
# LOCAL EKF (Continuous odometry, immune to discrete jumps)
# Publishes: odom -> base_footprint
# Output: /odometry/local
# ==============================================================================
ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: velocities only (vx, vy, vz, vyaw)
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU: 3D orientation (roll, pitch, yaw) and angular velocities (wx, wy, wz)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false

# ==============================================================================
# GLOBAL EKF (Fuses continuous odometry + absolute GPS fixes)
# Publishes: map -> odom
# Output: /odometry/global
# ==============================================================================
ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    publish_tf: true

    # Continuous 3D odometry from local EKF: fuses height (z), tilt (roll, pitch), and velocities
    odom0: /odometry/local
    odom0_config: [false, false, true,
                   true,  true,  false,
                   true,  true,  true,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # GPS: converted to Cartesian position (x, y ONLY - never z) in map frame by navsat_transform
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # IMU: orientation and angular velocities
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false

# ==============================================================================
# NAVSAT TRANSFORM (GPS fix -> map-frame Cartesian odometry)
# Output: /odometry/gps
# ==============================================================================
navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true
    datum: [50.0614, 19.9365, 0.0]
