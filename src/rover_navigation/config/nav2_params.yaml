bt_navigator:                                                                                                                                                              
  ros__parameters:                                                                                                                                                         
    use_sim_time: True                                                                                                                                                     
    global_frame: map                                                                                                                                                      
    robot_base_frame: base_footprint                                                                                                                                       
    odom_topic: /odometry/global                                                                                                                                           
    bt_loop_duration: 10                                                                                                                                                   
    default_server_timeout: 20                                                                                                                                             
                                                                                                                                                                            
controller_server:                                                                                                                                                         
  ros__parameters:                                                                                                                                                         
    use_sim_time: True                                                                                                                                                     
    controller_frequency: 20.0                                                                                                                                             
    min_x_velocity_threshold: 0.001                                                                                                                                        
    min_y_velocity_threshold: 0.5                                                                                                                                          
    min_theta_velocity_threshold: 0.001                                                                                                                                    
    failure_tolerance: 0.3                                                                                                                                                 
    progress_checker_plugin: "progress_checker"                                                                                                                            
    goal_checker_plugins: ["general_goal_checker"]                                                                                                                         
    controller_plugins: ["FollowPath"]                                                                                                                                     
                                                                                                                                                                            
    progress_checker:                                                                                                                                                      
      plugin: "nav2_controller::SimpleProgressChecker"                                                                                                                     
      required_movement_radius: 0.5                                                                                                                                        
      movement_time_allowance: 10.0                                                                                                                                        
                                                                                                                                                                            
    general_goal_checker:                                                                                                                                                  
      stateful: True                                                                                                                                                       
      plugin: "nav2_controller::SimpleGoalChecker"                                                                                                                         
      xy_goal_tolerance: 0.4                                                                                                                                               
      yaw_goal_tolerance: 0.5                                                                                                                                              
      transform_tolerance: 0.2                                                                                                                                             
                                                                                                                                                                            
    FollowPath:                                                                                                                                                            
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"                                                                                     
      desired_linear_vel: 0.5                                                                                                                                              
      lookahead_dist: 0.8                                                                                                                                                  
      min_lookahead_dist: 0.4                                                                                                                                              
      max_lookahead_dist: 1.5                                                                                                                                              
      lookahead_time: 1.5                                                                                                                                                  
      rotate_to_heading_angular_vel: 0.8                                                                                                                                   
      transform_tolerance: 0.2                                                                                                                                             
      use_velocity_scaled_lookahead_dist: true                                                                                                                             
      min_approach_linear_vel: 0.1                                                                                                                                         
      approach_velocity_scaling_dist: 1.0                                                                                                                                  
      use_collision_detection: true                                                                                                                                        
      max_allowed_time_to_collision_up_to_fast_stop: 1.5                                                                                                                   
      use_regulated_linear_velocity_scaling: true                                                                                                                          
      use_cost_regulated_linear_velocity_scaling: true                                                                                                                     
      regulated_linear_scaling_min_radius: 0.9                                                                                                                             
      regulated_linear_scaling_min_speed: 0.1                                                                                                                              
      use_rotate_to_heading: true                                                                                                                                          
      rotate_to_heading_min_angle: 0.785                                                                                                                                   
      max_angular_accel: 2.0    
                                                                                                                                              
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["traversability_layer", "obstacle_layer", "inflation_layer"]

      traversability_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /traversability/costmap
        subscribe_to_updates: True
        map_subscribe_transient_local: True
        transform_tolerance: 0.2
        lethal_cost_threshold: 100

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: obstacle_cloud
        obstacle_cloud:
          topic: /segmentation/obstacle
          data_type: "PointCloud2"
          min_obstacle_height: -2.0
          max_obstacle_height: 3.0
          marking: True
          clearing: True
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 12.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 60
      height: 60
      resolution: 0.1
      robot_radius: 0.35
      plugins: ["traversability_layer", "obstacle_layer", "inflation_layer"]

      traversability_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /traversability/costmap
        subscribe_to_updates: True
        map_subscribe_transient_local: True
        transform_tolerance: 0.2
        lethal_cost_threshold: 100

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: obstacle_cloud
        obstacle_cloud:
          topic: /segmentation/obstacle
          data_type: "PointCloud2"
          min_obstacle_height: -2.0
          max_obstacle_height: 3.0
          marking: True
          clearing: True
          obstacle_max_range: 12.0
          raytrace_max_range: 15.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 12.0
        inflation_radius: 0.40
      always_send_full_costmap: True

planner_server:                                                                                                                                                            
  ros__parameters:                                                                                                                                                         
    expected_planner_frequency: 10.0                                                                                                                                       
    use_sim_time: True                                                                                                                                                     
    planner_plugins: ["GridBased"]                                                                                                                                         
    GridBased:                                                                                                                                                             
      plugin: "nav2_navfn_planner::NavfnPlanner"                                                                                                                           
      tolerance: 0.5                                                                                                                                                       
      use_astar: true                                                                                                                                                      
      allow_unknown: true                                                                                                                                                  
                                                                                                                                                                            
behavior_server:                                                                                                                                                           
  ros__parameters:                                                                                                                                                         
    costmap_topic: local_costmap/costmap_raw                                                                                                                               
    footprint_topic: local_costmap/published_footprint                                                                                                                     
    cycle_frequency: 10.0                                                                                                                                                  
    behavior_plugins: ["spin", "backup", "wait"]                                                                                                                           
    spin:                                                                                                                                                                  
      plugin: "nav2_behaviors::Spin"                                                                                                                                       
    backup:                                                                                                                                                                
      plugin: "nav2_behaviors::BackUp"                                                                                                                                     
    wait:                                                                                                                                                                  
      plugin: "nav2_behaviors::Wait"                                                                                                                                       
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
